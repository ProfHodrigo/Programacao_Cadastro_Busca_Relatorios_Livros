<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo da Biblioteca Virtual</title>
  <desc id="desc">O navegador envia uma requisição ao Flask; Python processa a lógica e consulta o SQLite. A resposta volta como HTML ao navegador.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#52657e"/>
    </marker>
  </defs>
  <rect width="1000" height="330" rx="22" fill="#f4f7fb"/>
  <text x="40" y="49" fill="#172b4d" font-family="Arial, sans-serif" font-size="25" font-weight="700">Como uma página chega ao navegador</text>
  <text x="40" y="77" fill="#52657e" font-family="Arial, sans-serif" font-size="15">Uma visão simplificada do caminho de ida e volta dos dados.</text>
  <g font-family="Arial, sans-serif">
    <rect x="48" y="125" width="185" height="100" rx="16" fill="#fff" stroke="#1769aa" stroke-width="3"/>
    <text x="140" y="165" text-anchor="middle" fill="#1769aa" font-size="20" font-weight="700">Navegador</text>
    <text x="140" y="193" text-anchor="middle" fill="#52657e" font-size="14">solicita uma página</text>
    <rect x="302" y="125" width="185" height="100" rx="16" fill="#fff" stroke="#16836b" stroke-width="3"/>
    <text x="394" y="165" text-anchor="middle" fill="#16836b" font-size="20" font-weight="700">Flask + Python</text>
    <text x="394" y="193" text-anchor="middle" fill="#52657e" font-size="14">processam a requisição</text>
    <rect x="555" y="125" width="185" height="100" rx="16" fill="#fff" stroke="#c45b36" stroke-width="3"/>
    <text x="647" y="165" text-anchor="middle" fill="#a3482d" font-size="20" font-weight="700">SQLite</text>
    <text x="647" y="193" text-anchor="middle" fill="#52657e" font-size="14">guarda os livros</text>
    <rect x="810" y="125" width="145" height="100" rx="16" fill="#fff" stroke="#7452a3" stroke-width="3"/>
    <text x="882" y="165" text-anchor="middle" fill="#7452a3" font-size="20" font-weight="700">HTML</text>
    <text x="882" y="193" text-anchor="middle" fill="#52657e" font-size="14">página de resposta</text>
  </g>
  <path d="M237 153 H292" stroke="#52657e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M491 153 H545" stroke="#52657e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M745 153 H800" stroke="#52657e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M880 234 V278 H140 V234" fill="none" stroke="#52657e" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="510" y="267" text-anchor="middle" fill="#52657e" font-family="Arial, sans-serif" font-size="14">A resposta HTML volta ao navegador</text>
</svg>
