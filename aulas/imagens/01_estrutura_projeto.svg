<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Estrutura inicial do projeto</title>
  <desc id="desc">Árvore de diretórios com o ambiente virtual, app.py, requirements.txt, templates, static, uploads e database, acompanhados de suas funções.</desc>
  <rect width="1000" height="430" rx="22" fill="#f4f7fb"/>
  <text x="40" y="49" fill="#172b4d" font-family="Arial, sans-serif" font-size="25" font-weight="700">Cada arquivo no seu lugar</text>
  <text x="40" y="77" fill="#52657e" font-family="Arial, sans-serif" font-size="15">Uma organização inicial simples para a Biblioteca Virtual.</text>
  <rect x="42" y="105" width="390" height="282" rx="14" fill="#fff" stroke="#d5dfeb" stroke-width="2"/>
  <g font-family="Consolas, monospace" font-size="17" fill="#263b56">
    <text x="67" y="143" font-weight="700">biblioteca_virtual/</text>
    <text x="82" y="181">├── .venv/</text>
    <text x="82" y="218">├── app.py</text>
    <text x="82" y="255">├── requirements.txt</text>
    <text x="82" y="292">├── templates/</text>
    <text x="82" y="329">├── static/</text>
    <text x="82" y="366">├── uploads/</text>
    <text x="82" y="391">└── database/</text>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="476" y="112" width="476" height="45" rx="10" fill="#e7f1fb"/>
    <text x="498" y="141" fill="#1769aa" font-size="17" font-weight="700">.venv/</text>
    <text x="638" y="141" fill="#263b56" font-size="15">ambiente Python isolado</text>
    <rect x="476" y="165" width="476" height="45" rx="10" fill="#e8f5f1"/>
    <text x="498" y="194" fill="#16836b" font-size="17" font-weight="700">app.py</text>
    <text x="638" y="194" fill="#263b56" font-size="15">código principal da aplicação</text>
    <rect x="476" y="218" width="476" height="45" rx="10" fill="#fff1e9"/>
    <text x="498" y="247" fill="#a3482d" font-size="17" font-weight="700">requirements.txt</text>
    <text x="683" y="247" fill="#263b56" font-size="15">dependências do projeto</text>
    <rect x="476" y="271" width="476" height="45" rx="10" fill="#f0eafb"/>
    <text x="498" y="300" fill="#7452a3" font-size="17" font-weight="700">templates/</text>
    <text x="638" y="300" fill="#263b56" font-size="15">páginas HTML</text>
    <rect x="476" y="324" width="476" height="45" rx="10" fill="#e7f1fb"/>
    <text x="498" y="353" fill="#1769aa" font-size="17" font-weight="700">static/</text>
    <text x="638" y="353" fill="#263b56" font-size="15">CSS, imagens e arquivos estáticos</text>
    <text x="498" y="400" fill="#52657e" font-size="14">uploads/ guarda PDFs • database/ guarda o SQLite</text>
  </g>
</svg>
