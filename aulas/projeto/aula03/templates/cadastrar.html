{% extends "base.html" %}

{% block conteudo %}
<h1>Novo livro</h1>

<form method="post">
    <div class="mb-3">
        <label class="form-label" for="titulo">Título</label>
        <input class="form-control" type="text" id="titulo" name="titulo" required>
    </div>

    <div class="mb-3">
        <label class="form-label" for="autor">Autor</label>
        <input class="form-control" type="text" id="autor" name="autor" required>
    </div>

    <div class="mb-3">
        <label class="form-label" for="ano">Ano</label>
        <input class="form-control" type="number" id="ano" name="ano">
    </div>

    <div class="mb-3">
        <label class="form-label" for="categoria">Categoria</label>
        <input class="form-control" type="text" id="categoria" name="categoria">
    </div>

    <div class="mb-3">
        <label class="form-label" for="editora">Editora</label>
        <input class="form-control" id="editora" name="editora">
    </div>
    <div class="mb-3">
        <label class="form-label" for="descricao">Descrição</label>
        <textarea class="form-control" id="descricao" name="descricao"></textarea>
    </div>
    <button class="btn btn-success">Salvar</button>
</form>
{% endblock %}
