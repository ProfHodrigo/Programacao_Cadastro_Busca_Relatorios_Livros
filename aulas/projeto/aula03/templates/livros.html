{% extends "base.html" %}

{% block conteudo %}
<h1>Livros</h1>
<a class="btn btn-primary mb-3" href="{{ url_for('cadastrar_livro') }}">Novo livro</a>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Título</th>
            <th>Autor</th>
            <th>Ano</th>
        </tr>
    </thead>
    <tbody>
        {% for livro in livros %}
        <tr>
            <td>{{ livro.titulo }}</td>
            <td>{{ livro.autor }}</td>
            <td>{{ livro.ano }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
